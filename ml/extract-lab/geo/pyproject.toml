[project]
name = "extract-lab-geo"
version = "0.1.0"
description = "Moscow places PostGIS loader and fuzzy/geo place matcher for extract-lab"
requires-python = ">=3.12"
dependencies = [
    "httpx[socks]>=0.27",
    "psycopg[binary]>=3.2",
]

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "N", "SIM", "RUF", "PT"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
strict = true
python_version = "3.12"
explicit_package_bases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", ".."]
addopts = "-q"
