<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" fill="none">
  <defs>
    <pattern id="paper-dots" width="120" height="120" patternUnits="userSpaceOnUse">
      <circle cx="14" cy="18" r="1.2" fill="#171412" fill-opacity="0.06"/>
      <circle cx="88" cy="42" r="1" fill="#171412" fill-opacity="0.05"/>
      <circle cx="52" cy="96" r="1.3" fill="#171412" fill-opacity="0.06"/>
      <circle cx="106" cy="108" r="0.9" fill="#171412" fill-opacity="0.05"/>
    </pattern>
  </defs>

  <!-- Warm paper background -->
  <rect width="1200" height="630" fill="#F4EFE6"/>
  <rect width="1200" height="630" fill="url(#paper-dots)"/>
  <rect x="6" y="6" width="1188" height="618" stroke="#171412" stroke-width="6"/>

  <!-- Left column: Title & Places -->
  <g transform="translate(64, 56)">
    <!-- Stamp badge: ГДЕ ХАЙП? -->
    <g transform="rotate(-1.5, 92, 22)">
      <rect x="0" y="0" width="184" height="44" fill="#171412"/>
      <text x="92" y="28" text-anchor="middle" fill="#F4EFE6" font-family="'Dela Gothic One', 'Arial Black', sans-serif" font-size="20" font-weight="900" letter-spacing="1.2">ГДЕ ХАЙП?</text>
    </g>

    <!-- Main headline -->
    <text x="0" y="182" fill="#171412" font-family="'Dela Gothic One', 'Arial Black', sans-serif" font-size="82" font-weight="900" letter-spacing="-1">КУДА</text>
    <text x="0" y="264" fill="#171412" font-family="'Dela Gothic One', 'Arial Black', sans-serif" font-size="82" font-weight="900" letter-spacing="-1">В ПЯТНИЦУ?</text>

    <!-- Places subtitle -->
    <text x="0" y="328" fill="#6E665E" font-family="'Onest', 'Inter', system-ui, sans-serif" font-size="30" font-weight="600">Ровесник · Успех · Стрелка</text>

    <!-- CTA badge -->
    <g transform="translate(0, 444)">
      <rect x="6" y="6" width="380" height="64" rx="32" fill="#171412"/>
      <rect x="0" y="0" width="380" height="64" rx="32" fill="#E84427" stroke="#171412" stroke-width="3"/>
      <text x="190" y="40" text-anchor="middle" fill="#FBF8F2" font-family="'JetBrains Mono', monospace" font-size="22" font-weight="700" letter-spacing="1.5">ОТКРЫТЬ ПОДБОРКУ →</text>
    </g>
  </g>

  <!-- Right column: 3 place stickers -->
  <g transform="translate(760, 76)">
    <!-- Sticker 1: Ровесник (bar, coral) -->
    <g transform="translate(0, 0) rotate(-3, 180, 62)">
      <rect x="6" y="6" width="360" height="124" rx="18" fill="#171412"/>
      <rect x="0" y="0" width="360" height="124" rx="18" fill="#FBF8F2" stroke="#171412" stroke-width="4"/>
      <rect x="16" y="16" width="92" height="92" rx="12" fill="#E84427" stroke="#171412" stroke-width="3"/>
      <path d="M44 40h36l-14 20v16m-8 0h16" stroke="#171412" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="128" y="62" fill="#171412" font-family="'Dela Gothic One', 'Arial Black', sans-serif" font-size="30" font-weight="900">РОВЕСНИК</text>
      <text x="128" y="94" fill="#6E665E" font-family="'JetBrains Mono', monospace" font-size="20" font-weight="700">ТВЕРСКАЯ · ДО 04:00</text>
    </g>

    <!-- Sticker 2: Успех (club, lime) -->
    <g transform="translate(18, 174) rotate(2.5, 180, 62)">
      <rect x="6" y="6" width="360" height="124" rx="18" fill="#171412"/>
      <rect x="0" y="0" width="360" height="124" rx="18" fill="#C9F23C" stroke="#171412" stroke-width="4"/>
      <text x="32" y="62" fill="#171412" font-family="'Dela Gothic One', 'Arial Black', sans-serif" font-size="30" font-weight="900">УСПЕХ</text>
      <text x="32" y="94" fill="#171412" font-family="'JetBrains Mono', monospace" font-size="20" font-weight="700">КУРСКАЯ · 23:00–06:00</text>
    </g>

    <!-- Sticker 3: Стрелка (rooftop, amber) -->
    <g transform="translate(-8, 348) rotate(-1.5, 180, 62)">
      <rect x="6" y="6" width="360" height="124" rx="18" fill="#171412"/>
      <rect x="0" y="0" width="360" height="124" rx="18" fill="#F5A623" stroke="#171412" stroke-width="4"/>
      <text x="32" y="62" fill="#171412" font-family="'Dela Gothic One', 'Arial Black', sans-serif" font-size="30" font-weight="900">СТРЕЛКА</text>
      <text x="32" y="94" fill="#171412" font-family="'JetBrains Mono', monospace" font-size="20" font-weight="700">КРОПОТКИНСКАЯ · ДО 02:00</text>
    </g>
  </g>
</svg>
