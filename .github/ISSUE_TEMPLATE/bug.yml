name: Баг
description: Что-то работает не так
title: "Баг: "
labels: ["bug"]
body:
  - type: textarea
    id: steps
    attributes:
      label: Шаги
      value: |
        1.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Ожидалось
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: На самом деле
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Устройство и браузер
      description: Например, iPhone 13, Safari; или Telegram на Android.
