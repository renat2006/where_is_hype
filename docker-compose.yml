services:
  db:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_DB: where_is_hype
      POSTGRES_USER: where_is_hype
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-only}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U where_is_hype -d where_is_hype']
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./apps/api
    env_file:
      - path: ./apps/api/.env
        required: false
    ports:
      - '127.0.0.1:8000:8000'
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
